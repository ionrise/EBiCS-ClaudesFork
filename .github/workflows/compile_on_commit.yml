# Compiles the firmware with the committed Inc/config.h on every push and pull request.
#
# 1. ST-Link build (make/, the layout this fork uses): must pass. Artifacts: .hex/.bin/.elf.
# 2. Lishui UART bootloader build (root makefile, app at 0x08001000, max 26368 bytes, .lsh file for the
#    original Lishui bootloader): informational only. The EBiCS firmware of this fork is bigger than the
#    26 KB the UART bootloader leaves, so this step usually reports "region FLASH overflowed".
name: Compile on Commit

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # same compiler as System Workbench (Ac6) on the desktop
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '7-2018-q2'

      - name: ST-Link build (config.h as committed)
        run: |
          mkdir -p Debug/Src Debug/Startup Debug/Drivers/STM32F1xx_HAL_Driver/Src
          cp make/* Debug/
          cp Debug/subdir_src.mk Debug/Src/subdir.mk
          cp Debug/subdir_startup.mk Debug/Startup/subdir.mk
          cp Debug/subdir_drivers.mk Debug/Drivers/STM32F1xx_HAL_Driver/Src/subdir.mk
          cd Debug && make -j4 all
          mkdir -p ../artifacts/stlink && cp LishuiFOC_01.hex LishuiFOC_01.bin LishuiFOC_01.elf ../artifacts/stlink/

      - name: UART bootloader build (informational, usually too big)
        continue-on-error: true
        run: |
          mkdir -p build
          make -j4
          sudo apt-get install -y srecord
          java make/hexToLsh.java          # writes output/EBiCS_Firmware.lsh
          mkdir -p artifacts/uart-bootloader && cp output/* build/EBiCS_Firmware.hex artifacts/uart-bootloader/

      - uses: actions/upload-artifact@v4
        with:
          name: EBiCS_build_${{ github.run_number }}
          path: artifacts/
          retention-days: 10
